# ==============================================================================
# FOUNDATIONAL Conda Environment for Octo + LIBERO
# This file creates the BASE ONLY. The rest is installed via pip.
# ==============================================================================
name: octo-libero-eval
channels:
  - nvidia      # HIGHEST PRIORITY: For CUDA libraries
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.9
  - pip
  # Pin the version that works with old ABIs
  - numpy=1.24.1
  # The packages that are best installed by Conda
  - mujoco
  # The CUDA toolkit dependency for PyTorch and JAX
  - pytorch-cuda=11.8